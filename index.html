<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 시장 분석 대시보드</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --card-border: #232b38;
            --text-main: #f1f5f9;
            --text-sub: #8c9eb5;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-neon: #33d1b6;
            
            /* 피델리티 사이클 색상 정의 */
            --bg-plus-strong: rgba(34, 197, 94, 0.3);
            --bg-plus: rgba(34, 197, 94, 0.15);
            --bg-minus: rgba(239, 68, 68, 0.15);
            --bg-minus-strong: rgba(239, 68, 68, 0.35);
            --text-plus: #4ade80;
            --text-minus: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            padding: 20px 16px 60px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 860px;
        }

        /* 상단 메인 탭 네비게이션 */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 0 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent-neon);
            color: var(--text-main);
        }

        .nav-btn.active {
            background-color: var(--accent-neon);
            color: #0b0e14;
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(51, 209, 182, 0.3);
        }

        .tab-view {
            display: none;
        }

        .tab-view.active {
            display: block;
        }

        /* [현황 탭 스타일] */
        .overview-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #ffffff;
        }

        .indices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        @media (max-width: 520px) {
            .indices-grid {
                grid-template-columns: 1fr;
            }
        }

        .mini-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            height: 140px;
            overflow: hidden;
        }

        .section-divider {
            font-size: 18px;
            font-weight: 700;
            margin: 28px 0 14px;
            color: #ffffff;
        }

        .index-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .index-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .index-name {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .index-code {
            font-size: 11px;
            color: var(--accent-neon);
            background: rgba(51, 209, 182, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(51, 209, 182, 0.2);
        }

        .index-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--accent-neon);
            font-weight: 500;
        }

        .arrow-icon {
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--accent-neon);
            border-bottom: 2px solid var(--accent-neon);
            transform: rotate(45deg);
            transition: transform 0.3s ease;
        }

        .index-card.active .arrow-icon {
            transform: rotate(-135deg);
        }

        .chart-container {
            display: none;
            height: 480px;
            border-top: 1px solid var(--card-border);
            background-color: #0d1117;
        }

        .index-card.active .chart-container {
            display: block;
        }

        /* [경기 사이클 탭 스타일] */
        .cycle-intro {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 14px;
            color: #d1d5db;
        }

        .cycle-intro strong {
            color: var(--accent-neon);
        }

        .cycle-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .cycle-card h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table.fidelity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            text-align: center;
            min-width: 500px;
        }

        table.fidelity-table th {
            background-color: #1e293b;
            color: #ffffff;
            padding: 12px 8px;
            font-weight: 700;
            border-bottom: 2px solid var(--card-border);
        }

        table.fidelity-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--card-border);
            font-weight: 500;
        }

        table.fidelity-table td.sector-name {
            text-align: left;
            font-weight: 700;
            color: var(--text-main);
            background-color: #121824;
            padding-left: 12px;
        }

        .p-strong { background-color: var(--bg-plus-strong); color: var(--text-plus); font-weight: 700; }
        .p-weak   { background-color: var(--bg-plus); color: var(--text-plus); }
        .m-weak   { background-color: var(--bg-minus); color: var(--text-minus); }
        .m-strong { background-color: var(--bg-minus-strong); color: var(--text-minus); font-weight: 700; }

        .legend-box {
            background-color: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12.5px;
            color: var(--text-sub);
            line-height: 1.7;
        }

        .legend-box h4 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 13px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 메인 탭 네비게이션 -->
    <nav class="top-nav">
        <button class="nav-btn active" onclick="switchTab('tab-status', this)">
            📈 현황
        </button>
        <button class="nav-btn" onclick="switchTab('tab-cycle', this)">
            🔄 경기 사이클
        </button>
    </nav>

    <!-- 1. 현황 탭 페이지 -->
    <div id="tab-status" class="tab-view active">
