name: update-data
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 한국시간 화~토 06:30 (미국장 마감 후)
    - cron: "30 7 * * 1-5"    # 한국시간 월~금 16:30 (한국장 마감 후)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "update data" || exit 0
          git push
