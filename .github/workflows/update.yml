name: update-data
on:
  schedule:
    - cron: "0 21 * * *"   # 한국시간 매일 06:00
    - cron: "0 7 * * *"    # 한국시간 매일 16:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json history.json us_hist.json kr_hist.json val.json
          git commit -m "update data" || exit 0
          git push
